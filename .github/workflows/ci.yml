name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Tests are hermetic (fake models, no network) but config needs to load
          LLM_PROVIDER: groq
          GROQ_API_KEY: test-key-for-ci

      - name: Run evals
        run: python -m evals.run_evals
        continue-on-error: true  # evals may need API keys; tests are the gate
